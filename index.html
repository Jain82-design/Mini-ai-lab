
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini AI Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 14px;
        }

        h1 {
            color: #4338ca;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mini AI Study Assistant</h1>

        <p>Your personal study assistant.</p>

        <textarea id="question"
            placeholder="Enter a topic you want to learn..."></textarea>

        <button onclick="getAnswer()">Explain Topic</button>

        <div id="result"></div>
    </div>

    <script>
        function getAnswer() {
            const question =
                document.getElementById("question").value.trim();

            const result =
                document.getElementById("result");

            if (question === "") {
                result.textContent = "Please enter a topic first.";
                return;
            }

            result.textContent =
                "Your topic is: " + question +
                ". This is a sample response. We will connect a real AI model later.";
        }
    </script>
</body>
</html>
